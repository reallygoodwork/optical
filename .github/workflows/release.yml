# GitHub is the source of truth: there is no npm publish. Every push to main (or next/beta for
# prereleases) runs the full CI, then semantic-release reads the conventional commits since the
# last tag, picks the next version, tags the commit and writes a GitHub release with a prebuilt
# tarball attached. Pushes with only docs/test/chore/ci commits run the tests and release nothing.
name: Release

on:
  push:
    branches: [main, next, beta]
  workflow_dispatch:

# Never cancel a release half-way; queue the next push behind it instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  release:
    name: Tag and release on GitHub
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags, GitHub releases and their assets
      issues: write # release notes link issues
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # semantic-release always makes its first release 1.0.0. Optical starts at 0.x, so when the
      # repo has no version tag yet this step cuts v0.1.0 itself (tag on HEAD, release, tarball) and
      # semantic-release takes over from there. GitHub won't let the workflow token tag an older
      # commit whose workflow files differ from main, so the bootstrap tag goes on HEAD.
      - name: First release
        id: first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git tag -l 'v*' | grep -q .; then exit 0; fi
          npm version 0.1.0 --no-git-tag-version --allow-same-version
          npm pack
          mv reallygoodwork-optical-0.1.0.tgz optical-0.1.0.tgz
          git tag v0.1.0 HEAD
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" v0.1.0
          gh release create v0.1.0 "optical-0.1.0.tgz#optical-0.1.0.tgz (prebuilt, npm install-able)" \
            --repo "${{ github.repository }}" --title "v0.1.0" --generate-notes
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: semantic-release
        if: steps.first.outputs.done != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
