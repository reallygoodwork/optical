# Every push to main (or next/beta for prereleases) runs the full CI, then semantic-release reads
# the conventional commits since the last tag, picks the next version, publishes to npm with
# provenance, tags the commit and writes a GitHub release. Pushes with only docs/test/chore/ci
# commits run the tests and publish nothing.
name: Release

on:
  push:
    branches: [main, next, beta]
  workflow_dispatch:

# Never cancel a release half-way; queue the next push behind it instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  release:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags and GitHub releases
      issues: write # release notes link issues
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Verify dependency signatures
        run: npm audit signatures
      # semantic-release starts at 1.0.0 when it finds no version tag. The repo is meant to start at
      # 0.x from the v0.0.0 baseline tag, so refuse to publish without it.
      - name: Require a version tag
        run: |
          git tag -l 'v*' | grep -q . || { echo "::error::No v* tag found. Push the baseline first: git push origin v0.0.0"; exit 1; }
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for the very first publish, before the package exists on npm and a trusted
          # publisher can be attached to it. Delete the secret afterwards; OIDC takes over.
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$BOOTSTRAP_NPM_TOKEN" ]; then export NPM_TOKEN="$BOOTSTRAP_NPM_TOKEN"; fi
          npx semantic-release
