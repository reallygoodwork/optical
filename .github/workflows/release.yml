# GitHub is the source of truth: there is no npm publish. Every push to main (or next/beta for
# prereleases) runs the full CI, then semantic-release reads the conventional commits since the
# last tag, picks the next version, tags the commit and writes a GitHub release with a prebuilt
# tarball attached. Pushes with only docs/test/chore/ci commits run the tests and release nothing.
name: Release

on:
  push:
    branches: [main, next, beta]
  workflow_dispatch:

# Never cancel a release half-way; queue the next push behind it instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  release:
    name: Tag and release on GitHub
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags, GitHub releases and their assets
      issues: write # release notes link issues
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # semantic-release starts at 1.0.0 when it finds no version tag. Optical starts at 0.x, so the
      # first run tags the root commit v0.0.0 and the first real release becomes 0.1.0.
      - name: Baseline tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git tag -l 'v*' | grep -q .; then
            root=$(git rev-list --max-parents=0 HEAD | tail -1)
            git tag v0.0.0 "$root"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" v0.0.0
          fi
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
