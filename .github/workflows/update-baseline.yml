# Accept new CSS conformance results (after a Takumi upgrade fixes or changes features).
# Run it from the Actions tab on your branch; it commits test/conformance/baseline.json back.
name: Update conformance baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji
      - run: npm ci
      - run: npm run test:conformance -- --update-baseline
      - run: cat out/conformance/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add test/conformance/baseline.json test/conformance/baseline.chrome.txt
          git diff --cached --quiet && echo "Baseline unchanged" || (git commit -m "chore: update CSS conformance baseline" && git push)
